services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      APP_NAME: cardiosmart-backend
      APP_ENV: local
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://cardiosmart:cardiosmart@postgres:5432/cardiosmart
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cardiosmart
      POSTGRES_USER: cardiosmart
      POSTGRES_PASSWORD: cardiosmart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardiosmart -d cardiosmart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
